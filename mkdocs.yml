# MkDocs configuration for https://gbfs-ha-integration.blunan.com/.
site_name: GBFS for Home Assistant
site_description: Live bike, e-bike and dock availability in Home Assistant for stations from any GBFS bike-share feed.
site_url: https://gbfs-ha-integration.blunan.com/
repo_url: https://github.com/blunan/gbfs-ha-integration
repo_name: blunan/gbfs-ha-integration
edit_uri: ""
copyright: Copyright &copy; 2026 Brayan Luna &middot; MIT
exclude_docs: |
  requirements.*

theme:
  name: material
  font: false                                  # system fonts (no Google Fonts requests)
  favicon: assets/favicon.svg                  # material/bicycle, the logo icon, filled Amber for light and dark tabs
  icon:
    logo: material/bicycle
    repo: fontawesome/brands/github
  palette:
    - scheme: slate                  # listed first: docs open dark
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/blunan-brand.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Configuration: configuration.md
  - Using it:
      - Entities: entities.md
      - Dashboards and automations: examples.md
      - Supported feeds: feeds.md
      - Troubleshooting: troubleshooting.md
  - Development:
      - How it works: architecture.md
      - Contributing & releases: development.md
